name: Feature request
description: Suggest a concrete workflow improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: "For conversions, include an example input and desired output."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
